# ローカルでの通し確認用。
#
#   docker compose up --build
#   → http://localhost:8080
#
# LLMはホスト側のOllamaを使う（コンテナに18GBのモデルを入れないため）。
# 事前に以下でOllamaを起動しておくこと:
#   OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_CONTEXT_LENGTH=32768 ollama serve

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # 認証はWikiのアカウントに委ねる（共有パスワードは廃止）
      WIKI_API: ${WIKI_API:-https://wasabirdman.sakura.ne.jp/wbwiki/w/api.php}
      # 未設定だと再起動のたびに全員ログアウトになる
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      DAILY_LIMIT: ${DAILY_LIMIT:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:30b-a3b}
      # LLM_PROVIDER=claude のときだけ使う
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
